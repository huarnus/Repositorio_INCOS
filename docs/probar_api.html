<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Comprobar API INCOS</title><style>body{font:16px system-ui;max-width:900px;margin:40px auto;padding:20px;background:#f6f8fc;color:#17253d}label{display:block;margin:12px 0}input,select,textarea,button{font:inherit;padding:10px;border:1px solid #ccd4df;border-radius:6px}input,textarea{width:95%}button{background:#164fa8;color:white;cursor:pointer}pre{background:#10213a;color:#d9f3ff;padding:20px;white-space:pre-wrap;overflow-wrap:anywhere}fieldset{margin:20px 0;border:1px solid #ccd4df;border-radius:10px}</style><h1>Comprobar la API REST</h1><p>Esta página es una herramienta adicional. El diseño del repositorio permanece en sus pantallas originales.</p><fieldset><legend>Sesión</legend><label>Usuario <input id="user" autocomplete="username"></label><label>Contraseña <input id="pass" type="password" autocomplete="current-password"></label><button id="login">Iniciar sesión</button><button id="logout">Cerrar sesión</button></fieldset><fieldset><legend>Solicitud HTTP</legend><label>Método <select id="method"><option>GET</option><option>POST</option><option>PATCH</option><option>PUT</option><option>DELETE</option></select></label><label>Recurso <input id="path" value="/carreras"></label><label>Cuerpo JSON <textarea id="body" rows="4">{}</textarea></label><button id="send">Enviar solicitud</button></fieldset><p id="status" role="status">Listo. Empieza con GET /health o GET /carreras.</p><pre id="output">La respuesta JSON aparecerá aquí.</pre><script>
'use strict';let csrf;const api=new URL('../api/index.php',location.href);const el=id=>document.getElementById(id);
async function run(path,method='GET',body){const u=new URL(api);u.searchParams.set('route','/v1'+path);const headers={Accept:'application/json'};if(method!=='GET'){if(!csrf){const j=await run('/auth/csrf');csrf=j.data.csrf_token;}headers['X-CSRF-Token']=csrf;headers['Content-Type']='application/json';}const response=await fetch(u,{method,headers,credentials:'same-origin',body:method==='GET'?undefined:JSON.stringify(body)});const j=await response.json();el('status').textContent=method+' '+u.pathname+u.search+' → HTTP '+response.status;el('output').textContent=JSON.stringify(j,null,2);if(!response.ok)throw new Error(j.error?.message||'Solicitud fallida.');return j;}
el('send').onclick=async()=>{try{const path=el('path').value;if(!path.startsWith('/'))throw new Error('La ruta debe empezar con /.');await run(path,el('method').value,JSON.parse(el('body').value));}catch(e){el('status').textContent=e.message;}};
el('login').onclick=async()=>{try{const j=await run('/auth/login','POST',{usuario:el('user').value,contraseña:el('pass').value});csrf=j.data.csrf_token;el('pass').value='';}catch(e){el('status').textContent=e.message;}};
el('logout').onclick=async()=>{try{await run('/auth/logout','POST',{});csrf=null;}catch(e){el('status').textContent=e.message;}};
</script></html>
